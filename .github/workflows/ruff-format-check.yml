# .github/workflows/ruff-format-check.yml
name: Ruff Format Check

# This workflow checks the ruff formatting of every template on pull requests to master
on:
  pull_request:
    branches: [ master ]

jobs:
  ruff-format-check:
    runs-on: ubuntu-latest
    
    steps:
    # Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Run Ruff format check on all templates (each template's own pyproject.toml
    # configures ruff for the files underneath it)
    - name: Check formatting with Ruff
      uses: astral-sh/ruff-action@v3
      with:
        args: "format --check templates/"