[project]
name = "hydra_torch_mlflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.12"
dependencies = [
  "hydra-core>=1.3.4",
  "mlflow>=3.12.0",
  "numpy>=2.3.2",
  "pillow>=12.0.0",
  "tqdm>=4.70.0",
  "torch>=2.13.0",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch", marker = "sys_platform != 'darwin'" }
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = ["tests"]
markers = ["unit: unit tests", "integration: integration tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "__pycache__", "dist", "build"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # import sorting
  "B",  # bugbear
  "UP", # pyupgrade
  "D",  # docstring
]

ignore = [
  "E501", # handled by formatter
  "D202", # whitespace after docstings
  "D203",
  "D212", # conflicting docstring rules
  "D100", # dont require docstrings for __init__ methods
  "D103",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.pydocstyle]
convention = "numpy"
